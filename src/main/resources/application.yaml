spring:
  application:
    name: service-desk
  messages:
    basename: ValidationMessages

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: validate      # validate / update / create-drop / none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  jackson:
    serialization:
      INDENT_OUTPUT: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  tomcat:
    threads:
      max: 20

logging:
  level:
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}  # 7 дней

servicenow:
  encryption:
    key: ${SERVICENOW_ENCRYPTION_KEY}